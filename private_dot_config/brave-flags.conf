# Read by /usr/bin/brave (brave-bin). Hardware video decode on the RTX 5070 Ti via VA-API
# (libva-nvidia-driver), after wiki.cachyos.org "Chromium-Based Browsers HW Acceleration".
# VaapiOnNvidiaGPUs: Chromium otherwise refuses VA-API on NVIDIA and decodes in software.
# No AcceleratedVideoEncoder: the NVIDIA VA-API driver only decodes.
# Chromium honours only the last --enable-features, so keep all features on one line.
--enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks

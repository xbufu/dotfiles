# Android emulators (qemu-system-x86_64) ask for ~5 ms buffers (236/44100). That pulls the whole
# PipeWire graph down to a 256-sample quantum and caused crackling in every other app (xruns).
# A minimum of 1024/48000 (~21 ms) is plenty for emulator sound and keeps the graph stable.
pulse.rules = [
    {
        matches = [ { application.process.binary = "qemu-system-x86_64" } ]
        actions = { update-props = { pulse.min.quantum = 1024/48000 } }
    }
]

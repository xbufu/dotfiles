# Onboard S/PDIF output (speakers): occasional xruns -> crackling. More ALSA headroom gives the
# HDA controller a safety margin; no suspend avoids the pop when the receiver relocks after idle.
# Matches only the node name of this board, so other hosts are unaffected.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.pci-0000_80_1f.3.iec958-stereo" } ]
    actions = {
      update-props = {
        api.alsa.headroom = 1024
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
